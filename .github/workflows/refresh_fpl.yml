name: Stage 1 — FPL data fetch

on:
  schedule:
    # Runs daily at 23:30 UTC. Exits immediately if GW is not finished
    # or has already been fetched.
    - cron: "30 23 * * *"
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Stage 1 — FPL fetch
        id: fetch
        run: python scripts/check_and_fetch_fpl.py

      - name: Commit updated FPL data and state
        if: steps.fetch.outputs.fetched == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Stage 1 — FPL data refresh [skip ci]"
          file_pattern: "data/raw/fpl_*.parquet data/pipeline_state.json"
          commit_user_name: "fpl-intelligence-bot"
          commit_user_email: "bot@fpl-intelligence"
