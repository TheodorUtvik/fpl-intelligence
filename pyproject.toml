[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E501",  # line length — formatting is not this project's priority
    "E402",  # scripts/app modules insert ROOT into sys.path before importing src/ — intentional
]
